<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTW Play — 3번 선화 조정</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f4;color:#252a2a;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:1080px;margin:auto;padding:32px 24px}h1{font-size:26px;margin:0 0 10px}p{font-size:14px;color:#626969;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}article{background:white;border:1px solid #e1e5e2;border-radius:14px;overflow:hidden}article>img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.body{padding:0 24px 24px}h2{font-size:17px;margin:0 0 8px}.sizes{display:flex;gap:20px;align-items:flex-end;padding-top:16px;border-top:1px solid #eee}.sample{text-align:center;font-size:11px;color:#78807c}.sample img{display:block;margin-bottom:8px;width:var(--s);height:var(--s)}a{color:#246568;text-underline-offset:4px}.note{font-size:12px}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style><main><h1>OTW Play</h1><p>3번의 음표·재생 구성을 유지하고, 참고 이미지처럼 가는 곡선과 열린 윤곽으로 조정했습니다. 코럴·틸·앰버를 모두 유지했습니다.</p><section class="grid"><article><img src="../round-3/03-note-play.png" alt="이전 3번 음표와 재생 시안"><div class="body"><h2>이전 시안</h2><p>굵은 획과 채워진 재생 기호.</p></div></article><article><img src="03-note-play-refined.png" alt="가는 둥근 선과 열린 윤곽으로 조정한 음표와 재생 심볼"><div class="body"><h2>참고 이미지의 선화 반영</h2><p>가늘고 둥근 선, 끊긴 원형 윤곽, 비워둔 재생 기호.</p><div class="sizes" data-src="03-note-play-refined.png"></div><p><a href="03-note-play-refined.png" download>PNG 원본</a></p></div></article></section><p class="note">축소 표시는 원본 캔버스 기준 24 / 32 / 48 / 64px입니다. PNG 콘셉트 시안입니다.</p></main><script>document.querySelectorAll('.sizes').forEach(row=>{[24,32,48,64].forEach(size=>{const cell=document.createElement('div');cell.className='sample';const img=document.createElement('img');img.src=row.dataset.src;img.alt='';img.style.setProperty('--s',size+'px');const label=document.createElement('span');label.textContent=size+'px';cell.append(img,label);row.append(cell)})})</script></html>
