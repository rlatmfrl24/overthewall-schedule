<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OTW Play — 음표 기반 로고 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#292b2b;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:1240px;margin:auto;padding:36px 28px}h1{font-size:28px;letter-spacing:-1px;margin:0 0 12px}p{line-height:1.7;color:#5c6060;font-size:14px}header{margin-bottom:24px}.palette{display:flex;gap:20px;flex-wrap:wrap;font-size:12px}.palette span{display:flex;align-items:center;gap:7px}.palette i{width:14px;height:14px;border-radius:50%;background:var(--c)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e5e6e3}.hero{width:100%;aspect-ratio:1;object-fit:contain;display:block}.body{padding:0 24px 20px}h2{font-size:17px;letter-spacing:-.4px;margin:0 0 8px}.sizes{display:flex;align-items:flex-end;gap:24px;padding:16px 0;border-top:1px solid #eee}.sample{display:flex;align-items:center;flex-direction:column;gap:10px}.sample img{display:block;width:var(--s);height:var(--s);object-fit:contain}.sample span{font-size:11px;color:#747878}a{color:#315758;text-underline-offset:4px}.note{font-size:12px;margin-top:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}main{max-width:520px;padding:28px 20px}}
</style>
<main><header><h1>OTW Play</h1><p>음표 기반 시안 · 코럴, 틸, 앰버를 모두 사용한 글자 없는 심볼입니다.</p><div class="palette"><span><i style="--c:#F66479"></i>코럴 #F66479</span><span><i style="--c:#31A4A9"></i>틸 #31A4A9</span><span><i style="--c:#FFB14E"></i>앰버 #FFB14E</span></div></header>
<section class="grid" aria-label="음표 기반 로고 시안 비교">
<article class="card"><img class="hero" src="01-eighth-note.png" alt="앰버, 코럴, 틸로 그린 한 음표 심볼"><div class="body"><h2>01 · 한 음표</h2><p>음표 하나를 둥근 선과 열린 여백으로 표현했습니다.</p><div class="sizes" data-src="01-eighth-note.png"></div><a href="01-eighth-note.png" download>PNG 원본</a></div></article>
<article class="card"><img class="hero" src="02-beamed-notes.png" alt="앰버, 코럴, 틸로 그린 연결된 두 음표 심볼"><div class="body"><h2>02 · 연결된 두 음표</h2><p>두 음표를 앰버 연결선으로 이어 리듬을 표현했습니다.</p><div class="sizes" data-src="02-beamed-notes.png"></div><a href="02-beamed-notes.png" download>PNG 원본</a></div></article>
<article class="card"><img class="hero" src="03-note-play.png" alt="앰버, 코럴, 틸로 그린 음표와 재생 심볼"><div class="body"><h2>03 · 음표와 재생</h2><p>음표의 형태를 중심으로 재생 방향을 결합했습니다.</p><div class="sizes" data-src="03-note-play.png"></div><a href="03-note-play.png" download>PNG 원본</a></div></article>
</section><p class="note">작은 이미지는 원본 캔버스 기준 24 / 32 / 48 / 64px입니다. PNG 콘셉트 시안입니다.</p></main>
<script>document.querySelectorAll('.sizes').forEach(row=>{[24,32,48,64].forEach(size=>{const cell=document.createElement('div');cell.className='sample';const img=document.createElement('img');img.src=row.dataset.src;img.alt='';img.style.setProperty('--s',size+'px');const label=document.createElement('span');label.textContent=size+'px';cell.append(img,label);row.append(cell)})})</script>
</html>
